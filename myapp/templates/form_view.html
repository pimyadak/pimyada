{% extends 'basetemplate.html' %}
{% load static %}

{% block title %}เพิ่มข้อมูลพนักงาน - PM Mobile Store{% endblock %}

{% block content %}
<style>
    /* 1. Navbar สไตล์พลาสเทล */
    .navbar-custom {
        background: rgba(255, 240, 243, 0.85) !important;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 182, 193, 0.4);
        box-shadow: 0 4px 20px rgba(255, 182, 193, 0.15);
    }
    .navbar-custom .navbar-brand,
    .navbar-custom .nav-link {
        color: #6d4c53 !important;
        font-weight: 500;
        transition: color 0.2s;
    }
    .navbar-custom .nav-link:hover,
    .navbar-custom .nav-link.active {
        color: #d63384 !important;
    }

    /* 2. สไตล์การ์ดฟอร์มพลาสเทล */
    .card-form-pastel {
        border: none !important;
        border-radius: 24px !important;
        background: rgba(255, 255, 255, 0.95) !important;
        box-shadow: 0 10px 30px rgba(255, 182, 193, 0.25) !important;
        border-top: 5px solid #ffb6c1 !important;
    }
    .text-pink-custom {
        color: #d63384 !important;
    }

    /* สไตล์ช่องกรอกข้อมูล */
    .form-control-pastel, .form-select-pastel {
        border: 1.5px solid #ffccd5 !important;
        border-radius: 12px !important;
        padding: 10px 15px !important;
        transition: all 0.2s ease;
        background-color: #fffcfd !important;
    }
    .form-control-pastel:focus, .form-select-pastel:focus {
        border-color: #ff85a2 !important;
        box-shadow: 0 0 8px rgba(255, 133, 162, 0.3) !important;
        outline: none;
    }

    /* ปุ่มบันทึกพลาสเทลไล่ระดับสี */
    .btn-pink-submit {
        background: linear-gradient(135deg, #ff9a9e, #fecfef) !important;
        color: #5a3d40 !important;
        font-weight: 600 !important;
        border: none !important;
        border-radius: 50px !important;
        padding: 12px !important;
        transition: all 0.3s ease;
    }
    .btn-pink-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4) !important;
        color: #333 !important;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const nav = document.querySelector(".navbar");
        if (nav) {
            nav.classList.add("navbar-custom", "fixed-top");
            document.body.style.paddingTop = "85px";
        }
    });
</script>

<div class="container my-4 d-flex flex-column align-items-center">
    <div class="card p-4 p-md-5 card-form-pastel w-100" style="max-width: 650px;">
        <h3 class="fw-bold text-pink-custom mb-2 text-center">เพิ่มข้อมูลพนักงานใหม่ </h3>
        <p class="text-muted text-center small mb-4">กรอกรายละเอียดข้อมูลพนักงานในระบบให้ครบถ้วน</p>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold text-dark small">ชื่อจริง</label>
                    <input type="text" name="fname" class="form-control form-control-pastel" placeholder="ระบุชื่อจริง..." required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold text-dark small">นามสกุล</label>
                    <input type="text" name="lname" class="form-control form-control-pastel" placeholder="ระบุนามสกุล..." required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold text-dark small">อายุ (ปี)</label>
                    <input type="number" name="age" class="form-control form-control-pastel" placeholder="ระบุอายุ..." required> 
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold text-dark small">วันเกิด</label>
                    <input type="date" name="birthdate" class="form-control form-control-pastel" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold text-dark small">ที่อยู่ปัจจุบัน</label>
                <textarea name="address" class="form-control form-control-pastel" rows="3" placeholder="บ้านเลขที่, ถนน, ตำบล, อำเภอ, จังหวัด..." required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold text-dark d-block small mb-2">เพศ</label>
                <div class="d-flex gap-4 p-2 rounded-3" style="background-color: #fff0f3; border: 1.5px solid #ffccd5;">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="gender" value="male" id="genderMale" required>
                        <label class="form-check-label text-dark fw-normal" for="genderMale">ชาย</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="gender" value="female" id="genderFemale">
                        <label class="form-check-label text-dark fw-normal" for="genderFemale">หญิง</label>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold text-dark small">แผนกงาน</label>
                    <select name="department" class="form-select form-select-pastel">
                        <option value="Admin">แอดมิน</option>
                        <option value="hr">บุคคล</option>
                        <option value="ไอที">ไอที</option>
                        <option value="sales">ฝ่ายขาย</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold text-dark small">เงินเดือน (บาท)</label>
                    <input type="number" name="salary" class="form-control form-control-pastel" placeholder="0.00" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold text-dark small">รูปภาพโปรไฟล์พนักงาน</label>
                <input type="file" name="image" class="form-control form-control-pastel">
            </div>

            <button type="submit" class="btn btn-pink-submit w-100 shadow-sm">
                <i class="fa-solid fa-floppy-disk me-2"></i>บันทึกข้อมูลพนักงาน
            </button>
        </form>
    </div>
</div>

{% if success_message %}
<script>
    window.onload = function() {
        alert("{{ success_message }}");
    }
</script>
{% endif %}

<script src="{% static 'bootstrap/js/bootstrap.min.js' %}" async defer></script>
{% endblock %}
