{% extends 'basetemplate.html' %}
{% load static %}

{% block title %}หน้าหลัก - PM Mobile Store{% endblock %}

{% block content %}
<style>
    /* 1. ทำให้ Navbar ด้านบนกลายเป็นแบบใสพลาสเทล (Glassmorphism ชมพูอ่อน) */
    .navbar-custom {
        background: rgba(255, 240, 243, 0.85) !important;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 182, 193, 0.4);
        box-shadow: 0 4px 20px rgba(255, 182, 193, 0.15);
    }
    
    /* เปลี่ยนสีตัวอักษรบน Navbar ให้เข้ากับธีมชมพู */
    .navbar-custom .navbar-brand,
    .navbar-custom .nav-link {
        color: #6d4c53 !important;
        font-weight: 500;
        transition: color 0.2s;
    }
    .navbar-custom .nav-link:hover,
    .navbar-custom .nav-link.active {
        color: #d63384 !important;
    }

    /* ปุ่มออกจากระบบสไตล์พลาสเทล */
    .btn-outline-logout {
        border-color: #ffb6c1;
        color: #d63384;
        border-radius: 50px;
        transition: all 0.2s;
    }
    .btn-outline-logout:hover {
        background-color: #ffb6c1;
        color: #ffffff;
    }

    /* 2. Hero Banner โทนชมพูพลาสเทลละมุน */
    .hero-pastel {
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
        border-radius: 24px;
        color: #5a3d40;
        box-shadow: 0 10px 30px rgba(255, 154, 158, 0.25);
    }
    .btn-pastel {
        background-color: #ffffff;
        color: #d63384;
        border: none;
        font-weight: 600;
        transition: all 0.3s ease;
    }
    .btn-pastel:hover {
        background-color: #fff0f3;
        color: #b02a63;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }
    .card-pastel {
        border: none;
        border-radius: 20px;
        background-color: #ffffff;
        box-shadow: 0 8px 20px rgba(255, 182, 193, 0.15);
        transition: transform 0.3s ease;
    }
    .card-pastel:hover {
        transform: translateY(-5px);
    }
    .text-pink-custom {
        color: #d63384 !important;
    }
    .bg-light-pink {
        background-color: #fff5f7 !important;
    }
</style>

<script>
    // สคริปต์ช่วยปรับคลาส Navbar อัตโนมัติเมื่อโหลดหน้าเว็บ
    document.addEventListener("DOMContentLoaded", function() {
        const nav = document.querySelector(".navbar");
        if (nav) {
            nav.classList.add("navbar-custom", "fixed-top");
            document.body.style.paddingTop = "75px";
        }
    });
</script>

<!-- Hero Banner โทนชมพูพลาสเทลละมุน -->
<div class="p-5 mb-5 text-center hero-pastel position-relative overflow-hidden">
    <div class="container py-4">
        <h1 class="display-5 fw-bold mb-3"><i class="fa-solid fa-store me-2"></i>ยินดีต้อนรับสู่ PM Mobile Store<i class="fa-solid fa-store ms-2"></i></h1>
        <p class="fs-5 mb-4" style="opacity: 0.85;">แหล่งรวมอุปกรณ์ไอทีและแกดเจ็ตสุดคิวท์ ทันสมัยที่สุดสำหรับคุณ</p>
        <a href="/product/" class="btn btn-pastel btn-lg px-5 py-3 rounded-pill shadow-sm">
            <i class="fa-solid fa-cart-shopping me-2"></i>เริ่มต้นช็อปปิ้งออนไลน์
        </a>
    </div>
</div>

<!-- ส่วนสินค้าแนะนำยอดนิยม -->
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-dark m-0"><i class="fa-solid fa-heart text-pink-custom me-2"></i>สินค้าแนะนำยอดนิยม</h3>
        <a href="/product/" class="text-decoration-none text-pink-custom fw-semibold">ดูทั้งหมด <i class="fa-solid fa-arrow-right ms-1"></i></a>
    </div>

    
    </div>
</div>
{% endblock %}
