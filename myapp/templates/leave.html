{% extends 'basetemplate.html' %}
{% load static %}

{% block content %}
<div class="container my-4">
    <h2 class="text-dark fw-bold mb-4 text-center">📋 ระบบยื่นใบลาและบันทึกการลาพนักงาน</h2>

    <!-- ฟอร์มกรอกข้อมูลขอลา -->
    <div class="card p-4 mb-4 shadow-sm border-0 bg-white" style="border-radius: 12px;">
        <h5 class="text-primary fw-semibold mb-3"><i class="fa-solid fa-file-pen me-2"></i> ฟอร์มยื่นคำขอลาหยุด</h5>
        
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label small fw-semibold">เลือกพนักงาน</label>
                <select id="leaveEmp" class="form-select">
                    {% for person in all_employee %}
                    <option value="{{ person.fname }} {{ person.lname }} (รหัส: {{ person.emp_id }})">
                        {{ person.fname }} {{ person.lname }} (รหัส: {{ person.emp_id }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small fw-semibold">ประเภทการลา</label>
                <select id="leaveType" class="form-select" onchange="toggleMedicalCert()">
                    <option value="ลาป่วย"> ลาป่วย</option>
                    <option value="ลากิจส่วนตัว">ธุระ ลากิจส่วนตัว</option>
                    <option value="ลาพักร้อน"> ลาพักร้อน</option>
                    <option value="ลาคลอด / เลี้ยงดูบุตร"> ลาคลอด</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small fw-semibold">ตั้งแต่วันที่</label>
                <input type="date" id="startDate" class="form-control">
            </div>
            <div class="col-md-2">
                <label class="form-label small fw-semibold">ถึงวันที่</label>
                <input type="date" id="endDate" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-semibold">เหตุผลการลา</label>
                <input type="text" id="leaveReason" class="form-control" placeholder="เช่น ไปหาหมอ, ธุระครอบครัว">
            </div>

            <!-- ช่องแนบใบรับรองแพทย์ (แสดงเฉพาะเมื่อเลือก ลาป่วย) -->
            <div class="col-md-6" id="medicalCertContainer" style="display: none;">
                <label class="form-label small fw-semibold text-danger"> แนบใบรับรองแพทย์ (จำเป็นสำหรับลาป่วย)</label>
                <input type="file" id="medicalCertFile" class="form-control" accept="image/*,.pdf">
            </div>

            <div class="col-md-6 text-end d-flex align-items-end ms-auto">
                <button type="button" class="btn btn-success w-100 fw-semibold shadow-sm py-2" onclick="submitLeaveRequest()">
                    <i class="fa-solid fa-paper-plane me-1"></i> ส่งคำขอลา
                </button>
            </div>
        </div>
    </div>

    <!-- ตารางประวัติการลา -->
    <div class="card p-4 shadow-sm border-0 bg-white" style="border-radius: 12px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="text-dark fw-semibold mb-0"><i class="fa-solid fa-clock-rotate-left me-2 text-success"></i> ประวัติและสถานะการขอลาพนักงาน</h5>
            <span class="badge bg-success px-3 py-2">บันทึกอัตโนมัติด้วย LocalStorage</span>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>ชื่อพนักงาน</th>
                        <th>ประเภทการลา</th>
                        <th>ช่วงวันที่ลา</th>
                        <th>เหตุผล / ใบรับรองแพทย์</th>
                        <th class="text-center">สถานะ</th>
                        <th class="text-center">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="leaveTableBody">
                    <!-- ข้อมูลประวัติจะแสดงที่นี่ -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Script จัดการข้อมูลใบลาและสิทธิ์การอนุมัติ -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        toggleMedicalCert();
        loadLeaveHistory();
    });

    // ควบคุมการแสดงผลฟอร์มแนบใบรับรองแพทย์เฉพาะ "ลาป่วย"
    function toggleMedicalCert() {
        let leaveType = document.getElementById('leaveType').value;
        let certContainer = document.getElementById('medicalCertContainer');
        
        if (leaveType === 'ลาป่วย') {
            certContainer.style.display = 'block';
        } else {
            certContainer.style.display = 'none';
            let fileInput = document.getElementById('medicalCertFile');
            if(fileInput) fileInput.value = ""; 
        }
    }

    function submitLeaveRequest() {
        let emp = document.getElementById('leaveEmp').value;
        let type = document.getElementById('leaveType').value;
        let start = document.getElementById('startDate').value;
        let end = document.getElementById('endDate').value;
        let reason = document.getElementById('leaveReason').value || "-";
        let fileInput = document.getElementById('medicalCertFile');

        if (!start || !end) {
            alert("กรุณาเลือกวันที่เริ่มต้นและวันที่สิ้นสุดการลา");
            return;
        }

        if (type === 'ลาป่วย' && fileInput && fileInput.files.length === 0) {
            alert("กรุณาแนบใบรับรองแพทย์สำหรับการลาป่วย");
            return;
        }

        let fileName = (fileInput && fileInput.files.length > 0) ? fileInput.files[0].name : "ไม่มีเอกสารแนบ";

        let records = JSON.parse(localStorage.getItem('leaveRecords')) || [];
        records.unshift({
            id: Date.now(),
            emp: emp,
            type: type,
            dateRange: `${start} ถึง ${end}`,
            reason: reason,
            fileName: fileName,
            status: "รออนุมัติ"
        });

        localStorage.setItem('leaveRecords', JSON.stringify(records));
        
        // เคลียร์ฟอร์ม
        document.getElementById('leaveReason').value = "";
        document.getElementById('startDate').value = "";
        document.getElementById('endDate').value = "";
        if(fileInput) fileInput.value = "";
        toggleMedicalCert();

        loadLeaveHistory();
        alert("ยื่นใบลาสำเร็จ! รอผู้จัดการอนุมัติ");
    }

    function loadLeaveHistory() {
        let tbody = document.getElementById('leaveTableBody');
        tbody.innerHTML = "";
        let records = JSON.parse(localStorage.getItem('leaveRecords')) || [];

        if (records.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">ยังไม่มีประวัติการยื่นใบลา</td></tr>`;
            return;
        }

        // ตรวจสอบสถานะแอดมินจริงจาก Django 
        let isStaff = "{{ request.user.is_staff|yesno:'true,false' }}" === "true";

        records.forEach((rec, index) => {
            let statusBadge = "bg-warning text-dark";
            if (rec.status === "อนุมัติแล้ว") statusBadge = "bg-success";
            else if (rec.status === "ไม่อนุมัติ") statusBadge = "bg-danger";

            let certInfo = (rec.fileName && rec.fileName !== "ไม่มีเอกสารแนบ") 
                ? `<br><small class="text-primary"><i class="fa-solid fa-paperclip"></i> ใบรับรองแพทย์: ${rec.fileName}</small>` 
                : "";

            // ถ้าเป็นแอดมินให้แสดงปุ่มอนุมัติ/ปฏิเสธ ถ้าไม่ใช่ให้ซ่อน
            let actionButtons = isStaff ? `
                <button class="btn btn-sm btn-outline-success py-0 px-2 me-1" style="font-size:11px;" onclick="updateStatus(${rec.id}, 'อนุมัติแล้ว')">อนุมัติ</button>
                <button class="btn btn-sm btn-outline-danger py-0 px-2 me-1" style="font-size:11px;" onclick="updateStatus(${rec.id}, 'ไม่อนุมัติ')">ปฏิเสธ</button>
            ` : `<span class="text-muted small">รอตรวจสอบ</span>`;

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>#${records.length - index}</td>
                <td class="fw-semibold">${rec.emp}</td>
                <td><span class="badge bg-light text-dark border">${rec.type}</span></td>
                <td>${rec.dateRange}</td>
                <td><small class="text-muted">${rec.reason}</small>${certInfo}</td>
                <td class="text-center">
                    <span class="badge ${statusBadge}">${rec.status}</span>
                </td>
                <td class="text-center approval-section">
                    ${actionButtons}
                    <button class="btn btn-sm btn-outline-secondary py-0 px-1" style="font-size:11px;" onclick="deleteLeave(${rec.id})"><i class="fa-solid fa-trash"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function updateStatus(id, newStatus) {
        let records = JSON.parse(localStorage.getItem('leaveRecords')) || [];
        records = records.map(r => {
            if (r.id === id) r.status = newStatus;
            return r;
        });
        localStorage.setItem('leaveRecords', JSON.stringify(records));
        loadLeaveHistory();
    }

    function deleteLeave(id) {
        if (confirm("ต้องการลบรายการนี้ใช่หรือไม่?")) {
            let records = JSON.parse(localStorage.getItem('leaveRecords')) || [];
            records = records.filter(r => r.id !== id);
            localStorage.setItem('leaveRecords', JSON.stringify(records));
            loadLeaveHistory();
        }
    }
</script>
{% endblock %}
